name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked files and commit history
        run: python3 scripts/audit-public.py --history
      - name: Synthetic collector tests
        run: python3 -m unittest discover -s Tests -v
      - name: Swift and offline integration tests
        run: swift test
      - name: Install build generator
        run: brew install xcodegen
      - name: Build app and widget
        run: bash scripts/build.sh
      - name: Package local release
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MockUsage-local-build
          path: dist/
          retention-days: 7
