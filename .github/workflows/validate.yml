name: Validate
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan tracked files and commit history
        run: python3 scripts/audit-public.py --history
      - name: Synthetic collector tests
        run: python3 -m unittest discover -s Tests -v
      - name: Swift and offline integration tests
        run: swift test
      - name: Install build generator
        run: brew install xcodegen
      - name: Build app and widget
        run: bash scripts/build.sh
      - name: Package local release
        run: bash scripts/package-release.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MockUsage-local-build
          path: dist/
          retention-days: 7
