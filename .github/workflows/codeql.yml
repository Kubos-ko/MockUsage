name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            runner: ubuntu-latest
            build-mode: none
          - language: swift
            runner: macos-15-intel
            build-mode: manual
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select supported Swift toolchain
        if: matrix.language == 'swift'
        run: echo 'DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Install build generator before tracing
        if: matrix.language == 'swift'
        run: brew install xcodegen
      - uses: github/codeql-action/init@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Swift app and widget for analysis
        if: matrix.language == 'swift'
        run: |
          xcodegen generate
          xcodebuild -project MockUsage.xcodeproj -scheme MockUsage -configuration Debug -derivedDataPath build/CodeQL CODE_SIGNING_ALLOWED=NO build
      - uses: github/codeql-action/analyze@776237d428f23fefc3d9e0fe1962921cbcd53e17 # v4
        with:
          category: /language:${{ matrix.language }}
